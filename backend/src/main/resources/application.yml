spring:
  application:
    name: universidad-el-bosque-horarios
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/horarios}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:desarrollo-local-cambiar-por-un-secreto-de-32-caracteres}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
