    <rect x="0" y="200" width="140" height="100" fill="#dff3e7"/><rect x="140" y="200" width="140" height="100" fill="#fff2bf"/><rect x="280" y="200" width="140" height="100" fill="#fff2bf"/><rect x="420" y="200" width="140" height="100" fill="#f9d6a5"/><rect x="560" y="200" width="140" height="100" fill="#ef9aa2"/>
    <rect x="0" y="100" width="140" height="100" fill="#fff2bf"/><rect x="140" y="100" width="140" height="100" fill="#fff2bf"/><rect x="280" y="100" width="140" height="100" fill="#f9d6a5"/><rect x="420" y="100" width="140" height="100" fill="#ef9aa2"/><rect x="560" y="100" width="140" height="100" fill="#ef9aa2"/>
    <rect x="0" y="0" width="140" height="100" fill="#fff2bf"/><rect x="140" y="0" width="140" height="100" fill="#f9d6a5"/><rect x="280" y="0" width="140" height="100" fill="#f9d6a5"/><rect x="420" y="0" width="140" height="100" fill="#ef9aa2"/><rect x="560" y="0" width="140" height="100" fill="#d95b67"/>
    <g fill="none" stroke="#fff" stroke-width="3"><path d="M0 0H700V500H0Z"/><path d="M140 0V500M280 0V500M420 0V500M560 0V500M0 100H700M0 200H700M0 300H700M0 400H700"/></g>
    <g fill="#385e50" font-size="15" font-weight="700" text-anchor="middle"><text x="70" y="530">1</text><text x="210" y="530">2</text><text x="350" y="530">3</text><text x="490" y="530">4</text><text x="630" y="530">5</text><text x="-25" y="455">1</text><text x="-25" y="355">2</text><text x="-25" y="255">3</text><text x="-25" y="155">4</text><text x="-25" y="55">5</text></g>
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#18352b"><text x="630" y="252">R-01</text><text x="630" y="352">R-02 R-03 R-04</text><text x="350" y="252">R-05</text><text x="490" y="252">R-06</text><text x="210" y="252">R-07</text><text x="350" y="352">R-08</text></g>
