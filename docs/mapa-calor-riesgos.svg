  <g font-family="Arial" font-size="13"><rect x="620" y="586" width="18" height="18" fill="#dff3e7"/><text x="645" y="600">Bajo</text><rect x="700" y="586" width="18" height="18" fill="#fff2bf"/><text x="725" y="600">Medio</text><rect x="785" y="586" width="18" height="18" fill="#f9d6a5"/><text x="810" y="600">Alto</text><rect x="850" y="586" width="18" height="18" fill="#d95b67"/><text x="875" y="600">Crítico</text></g>
