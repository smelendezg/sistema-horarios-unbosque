<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de calor de riesgos</title><desc id="desc">Matriz de probabilidad e impacto de uno a cinco para ocho riesgos del sistema de horarios.</desc>
  <rect width="920" height="650" fill="#f8fbf8"/><text x="460" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18352b">Mapa de calor de riesgos</text>
  <text x="470" y="620" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#355c4d">Impacto →</text>
  <text x="35" y="335" text-anchor="middle" transform="rotate(-90 35 335)" font-family="Arial" font-size="17" font-weight="700" fill="#355c4d">Probabilidad →</text>
  <g transform="translate(110 80)" font-family="Arial">
    <rect x="0" y="400" width="140" height="100" fill="#dff3e7"/><rect x="140" y="400" width="140" height="100" fill="#dff3e7"/><rect x="280" y="400" width="140" height="100" fill="#fff2bf"/><rect x="420" y="400" width="140" height="100" fill="#fff2bf"/><rect x="560" y="400" width="140" height="100" fill="#f9d6a5"/>
